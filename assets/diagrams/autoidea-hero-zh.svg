<title id="title">结构化研究溯源</title>
<desc id="desc">清晰展示 AutoIdea 结构化溯源：已登记论文提供与来源绑定的证据主张；证据主张通过带类型的关系连接研究空白，也可直接支撑候选想法；候选想法经过排序与对抗式评审后进入结构化研究提案。</desc>
