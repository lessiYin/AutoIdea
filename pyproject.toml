[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoidea"
version = "0.1.0"
description = "Autonomous research idea generation with grounded reasoning and adversarial debate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [
    { name = "AutoIdea Team" },
]
keywords = ["ai-scientific", "research-ideas", "idea-generation", "adversarial-debate", "evidence-grounding"]

dependencies = [
    "deepagents>=0.4.11,<0.8",
    "langchain>=1.2.12,<2",
    "langchain-anthropic>=1.4,<2",
    "langchain-openai>=1.1,<2",
    "tavily-python>=0.7,<1",
    "httpx>=0.27,<1",
    "markdownify>=0.14,<2",
    "PyMuPDF>=1.24,<2",
    "defusedxml>=0.7.1,<1",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "typer>=0.12,<1",
    "rich>=14,<16",
    "prompt-toolkit>=3,<4",
    "questionary>=2,<3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "nest-asyncio>=1.6,<2",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=4.2.1,<5"]
ollama = ["langchain-ollama>=1,<2"]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.5,<1",
    "build>=1,<2",
]

[project.scripts]
autoidea = "autoidea.cli:main"

[tool.setuptools.packages.find]
include = ["autoidea*"]

[tool.setuptools.package-data]
autoidea = [
    "subagent.yaml",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:langchain_nvidia_ai_endpoints",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
