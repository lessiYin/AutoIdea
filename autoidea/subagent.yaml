           - feasibility_assessments.json
           - citations.json
           - fulltext_audit.json
           - audit_report.json
        2. Use think_tool to plan the report structure.
        3. Call audit_workspace_artifacts and stop if it reports any ERROR.

      Step 2 — WRITE EXECUTIVE SUMMARY:
        1. Summarize the research topic and motivation.
        2. Highlight key literature findings.
        3. List top ACCEPTED ideas in Elo rank order.
        4. State recommended next steps.

      Step 3 — WRITE LITERATURE LANDSCAPE:
        1. Summarize consensus findings with [Pn] citations.
        2. Describe emerging trends with evidence.
        3. List major research gaps from research_gaps.json and preserve their
           Claim-level provenance; use knowledge_synthesis.md for narrative context.

      Step 4 — WRITE RESEARCH IDEAS SECTION:
