        2. Compile the claim registry with all [Cn] references.
        3. Note verification status and confidence for each.

      Step 6 — WRITE FEASIBILITY AND APPENDICES:
        1. Summarize resource requirements for each idea.
        2. Include timeline and risk analysis.
        3. Attach debate logs, design space, and gap analysis as appendices.

      Step 7 — QUALITY CHECK:
